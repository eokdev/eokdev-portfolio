    (function () {
      try {
        var pref = localStorage.getItem('eokdev-theme');

        if (dark) document.documentElement.classList.add('dark');

  <style>
    :root { color-scheme: light dark; }
    html {
      color-scheme: light dark;
      background: #E7E7E8;
    }
    html.dark {
      color-scheme: dark;
      background: #141312;
    }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #E7E7E8;
    }
    html.dark, html.dark body {
      background: #141312;
    }
    html.chrome-ios #flutter-host {
      height: 100lvh;
      min-height: 100vh;
    }
    #flutter-host {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #E7E7E8;
    }
    html.dark #flutter-host {
      background: #141312;
    }
    #flutter-host flutter-view,
    #flutter-host flt-glass-pane,
    #flutter-host canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      background: transparent !important;
    }
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #E7E7E8;
      transition: opacity 0.3s ease;
    }
    html.dark #app-loader {
      background: #141312;
    }
    #app-loader.is-gone {
      opacity: 0;
      pointer-events: none;
    }
    #app-loader span {
      font: 400 15px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #748079;
    }
    html.dark #app-loader span {
      color: #9C9D98;
    }
    #web-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10001;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      background: #E7E7E8;
      box-sizing: border-box;
    }
    html.dark #web-nav {
      background: #141312;
    }
    @media (min-width: 700px) {
      #web-nav {
        padding-left: max(32px, env(safe-area-inset-left));
        padding-right: max(32px, env(safe-area-inset-right));
      }
    }
    @media (min-width: 1080px) {
      #web-nav {
        padding-left: max(56px, env(safe-area-inset-left));
        padding-right: max(56px, env(safe-area-inset-right));
      }
    }
    @media (min-width: 1400px) {
      #web-nav {
        padding-left: max(80px, env(safe-area-inset-left));
        padding-right: max(80px, env(safe-area-inset-right));
      }
    }
    #web-nav-home {
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      line-height: 0;
    }
    #web-nav-home img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    #web-nav-mail {
      flex: 1;
      min-width: 0;
      color: #080605;
      text-decoration: none;
      font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html.dark #web-nav-mail {
      color: #F3F1EE;
    }
    #web-nav-theme,
    #web-nav-menu {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #F4F4F2;
      cursor: pointer;
      padding: 0;
      color: #080605;
    }
    html.dark #web-nav-theme,
    html.dark #web-nav-menu {
      background: #1C1B19;
      color: #F3F1EE;
    }
    #web-nav-theme {
      margin-left: auto;
      display: grid;
      place-items: center;
    }
    #web-nav-theme svg {
      display: none;
      width: 18px;
      height: 18px;
    }
    html:not(.dark) #web-nav-theme .icon-moon { display: block; }
    html.dark #web-nav-theme .icon-sun { display: block; }
    #web-nav-menu {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 4px;
    }
    #web-nav-menu i {
      display: block;
      width: 16px;
      height: 1.5px;
      background: #080605;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    html.dark #web-nav-menu i {
      background: #F3F1EE;
    }
    #web-nav-menu.is-open i:nth-child(1) {
      transform: translateY(5.5px) rotate(45deg);
    }
    #web-nav-menu.is-open i:nth-child(2) {
      opacity: 0;
    }
    #web-nav-menu.is-open i:nth-child(3) {
      transform: translateY(-5.5px) rotate(-45deg);
    }

  <header id="web-nav">
    <button type="button" id="web-nav-home" aria-label="Home">

    <button type="button" id="web-nav-theme" aria-label="Use dark mode">

        <path d="M15.5 3.5a8.2 8.2 0 1 0 5 14.2 7.2 7.2 0 0 1-5-14.2z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
    </button>
    <button type="button" id="web-nav-menu" aria-label="Open menu">
      <i></i><i></i><i></i>
    </button>
  </header>
  <div id="flutter-host"></div>
  <div id="app-loader" aria-live="polite" aria-label="Loading">
    <span>Loading…</span>
  </div>
  <script>
    (function () {
      var chromeIos = /CriOS/i.test(navigator.userAgent);
      if (chromeIos) {
        document.documentElement.classList.add('chrome-ios');
        var host = document.getElementById('flutter-host');
        var large = Math.max(
          window.screen.height || 0,
          window.innerHeight || 0,
          document.documentElement.clientHeight || 0
        );
        host.style.height = large + 'px';
        host.style.minHeight = '100lvh';
      }

      function hideLoader() {
        var el = document.getElementById('app-loader');
        if (!el || el.classList.contains('is-gone')) return;
        el.classList.add('is-gone');
        setTimeout(function () { el.remove(); }, 280);
      }

      window.addEventListener('flutter-first-frame', function () {
        hideLoader();
        clearInterval(timer);
      });

      var checks = 0;
      var timer = setInterval(function () {
        checks++;
        if (checks > 150) {
          clearInterval(timer);
          hideLoader();
        }
      }, 200);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
