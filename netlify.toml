[build]
  command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable \"$HOME/flutter\" && export PATH=\"$HOME/flutter/bin:$PATH\" && flutter config --no-analytics && flutter pub get && flutter build web --release --csp --no-web-resources-cdn"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
